name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check bottom_hunter/src bottom_hunter/tests
      - run: ruff format --check bottom_hunter/src bottom_hunter/tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install package
        run: pip install -e "./bottom_hunter[dev]"
      - name: Run tests
        working-directory: bottom_hunter
        run: pytest tests
        env:
          QT_QPA_PLATFORM: offscreen
