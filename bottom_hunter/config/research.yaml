refresh:
  # 资产研究（新闻/财报/公告）与宏观各自按以下间隔刷新。
  # 当前实现中财报与公告随资产刷新一起执行，故生效间隔为 news_minutes。
  news_minutes: 15
  macro_minutes: 30

network:
  timeout_seconds: 12
  retries: 2

news:
  enabled: true
  language: zh-CN
  region: CN
  max_items: 30
  community_sites:
    - xueqiu.com

# favorable_direction: 1 = 上升偏利好，-1 = 下降偏利好，0 = 只展示不打分。
# 宏观信号只是环境标签，不直接改变个股基本面分。
macro_series:
  - id: CHNCPIALLMINMEI
    name: 中国 CPI
    dimension: 通胀压力
    unit: 指数
    favorable_direction: -1
  - id: MABMM301CNM189S
    name: 中国 M2
    dimension: 流动性
    unit: 本币
    favorable_direction: 1
  - id: CPIAUCSL
    name: 美国 CPI
    dimension: 通胀压力
    unit: 指数
    favorable_direction: -1
  - id: PCEPI
    name: 美国 PCE
    dimension: 通胀压力
    unit: 指数
    favorable_direction: -1
  - id: UNRATE
    name: 美国失业率
    dimension: 经济增长
    unit: "%"
    favorable_direction: -1
  - id: PAYEMS
    name: 美国非农就业
    dimension: 经济增长
    unit: 千人
    favorable_direction: 1
  - id: FEDFUNDS
    name: 美联储有效利率
    dimension: 流动性
    unit: "%"
    favorable_direction: -1
  - id: DGS2
    name: 美债 2Y
    dimension: 流动性
    unit: "%"
    favorable_direction: -1
  - id: DGS10
    name: 美债 10Y
    dimension: 流动性
    unit: "%"
    favorable_direction: -1
  - id: VIXCLS
    name: VIX 恐慌指数
    dimension: 风险偏好
    unit: 点
    favorable_direction: -1
  - id: DCOILWTICO
    name: WTI 原油
    dimension: 风险偏好
    unit: 美元/桶
    favorable_direction: 0

# 这是可编辑的启发式行业映射，界面会明确标注为“可能”影响。
macro_impact:
  经济增长:
    positive: [工业制造, 可选消费, 商业零售, 材料]
    negative: [公用事业, 红利与价值策略]
  通胀压力:
    positive: [可选消费, 医疗保健, 信息技术]
    negative: [能源, 材料, 贵金属]
  流动性:
    positive: [信息技术, 软件与互联网, 房地产, 加密货币]
    negative: [银行, 保险]
  风险偏好:
    positive: [信息技术, 传媒娱乐, 加密货币]
    negative: [贵金属, 公用事业, 红利与价值策略]
